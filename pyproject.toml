[project]
name = "evoke"
version = "0.1.0"
description = "Selective KV Cache Eviction and Recovery for Long-Context LLM Inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "llama-cpp-python>=0.3.0",
]

[project.scripts]
evoke-bench = "evoke.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

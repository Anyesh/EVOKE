[project]
name = "evoke"
version = "0.1.0"
description = "Selective KV Cache Eviction and Recovery for Long-Context LLM Inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "llama-cpp-python>=0.3.0",
    "jinja2>=3.1",
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
